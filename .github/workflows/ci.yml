name: Test Repo Setup Kit
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  unit-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile repo_setup.py
      - name: Validate shell scripts
        if: runner.os == 'Linux'
        run: sh -n install.sh scripts/publish-private.sh
      - name: Smoke test Linux installation
        if: runner.os == 'Linux'
        run: |
          sh install.sh
          "$HOME/.local/bin/repo-setup" . --doctor
      - name: Smoke test Windows installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1
          & "$env:LOCALAPPDATA/repo-setup/bin/repo-setup.cmd" . --doctor
